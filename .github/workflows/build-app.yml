name: Build App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - refactor/sync-backend-protocol

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: SKIP_DMG=1 bash Tokei/package.sh

      - name: Zip app
        run: cd Tokei && ditto -c -k --keepParent Tokei.app Tokei.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Tokei-app
          path: Tokei/Tokei.app.zip
          if-no-files-found: error
